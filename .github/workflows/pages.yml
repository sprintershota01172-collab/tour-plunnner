name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync distributable before validation
        run: |
          # Keep the published fallback copy identical to the canonical source.
          # Otherwise the existing regression suite blocks GitHub Pages releases.
          for file in app.js index.html styles.css sw.js i18n.js mobile-input.js notifications.js line-invite.js line-share.js date-range.js sync.js accounts.js account-ui.js account.css; do
            cp "$file" "dist/$file"
          done
      - name: Verify JavaScript syntax
        run: |
          for file in app.js sw.js i18n.js mobile-input.js notifications.js line-invite.js line-share.js date-range.js sync.js; do
            node --check "$file"
          done
      - name: Test password-protected sharing links
        run: node --test tests/*.test.cjs
      - name: Real mobile-browser souvenir interaction test
        run: |
          npm install --prefix /tmp/tabi-playwright --no-package-lock --no-save playwright-core@1.56.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" NODE_PATH=/tmp/tabi-playwright/node_modules node tests/browser-souvenir-smoke.cjs
      - name: Render LINE invitation card image
        run: |
          python -m pip install --quiet cairosvg
          python -c "from pathlib import Path; import cairosvg; [cairosvg.svg2png(url='invite-card-art.svg',write_to=str(p),output_width=1000,output_height=600) for p in (Path('invite-card-art.png'),Path('dist/invite-card-art.png'))]"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
